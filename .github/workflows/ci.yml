name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a busy PR doesn't queue stale work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build (publish artifacts)
        run: pnpm build

      # server.json is what the MCP Registry ingests, and it agrees with package.json only by hand.
      # The version drifted a release behind once; the mcpName is worse, because a mismatch there is
      # a rejected submission rather than a stale number.
      - name: server.json in sync
        run: pnpm sync:server-json --check

      # Dependency-license hygiene (ARCHITECTURE #20): fail on a redistributed copyleft/
      # non-commercial/proprietary dep before it can poison the permissive/commercial distribution.
      - name: License check
        run: pnpm licenses:check

  # Glama builds every open-source MCP server in a sandbox and withholds distribution — the profile
  # page survives, but the server stops appearing in search and category listings — when the build
  # does not start and answer an introspection exchange. That makes a rotting Dockerfile worse than
  # no Dockerfile, so the image is built and actually spoken to on every change.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t baron-mcp:ci .

      - name: The container answers an MCP handshake
        run: node scripts/mcp-handshake.mjs docker run -i --rm baron-mcp:ci

      - name: No credentials baked into the image
        # A layer keeps a file even when a later step deletes it, so this asserts the .dockerignore
        # entry rather than trusting it. `credentials.example` is committed and carries only empty
        # placeholders; a real `.baron/credentials` must never appear.
        run: |
          if docker run --rm --entrypoint sh baron-mcp:ci -c 'test -f /app/.baron/credentials'; then
            echo "::error::.baron/credentials is present in the image"
            exit 1
          fi
          echo "no credentials in the image"
